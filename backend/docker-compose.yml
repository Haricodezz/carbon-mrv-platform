services:
  # =========================
  # FASTAPI BACKEND
  # =========================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbon_mrv_backend
    restart: always
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - certificates_data:/app/storage/certificates
    networks:
      - carbon_network

  # =========================
  # POSTGRESQL
  # =========================
  postgres:
    image: postgres:15
    container_name: carbon_mrv_postgres
    restart: always
    environment:
      POSTGRES_USER: carbon_admin
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: carbon_mrv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - carbon_network

  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7
    container_name: carbon_mrv_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - carbon_network

  # =========================
  # CELERY WORKER
  # =========================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbon_mrv_celery_worker
    restart: always
    command: >
      celery -A celery_worker worker
      --loglevel=info
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres
    volumes:
      - .:/app
      - certificates_data:/app/storage/certificates
    networks:
      - carbon_network

  # =========================
  # CELERY BEAT
  # =========================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbon_mrv_celery_beat
    restart: always
    command: >
      celery -A celery_worker beat
      --loglevel=info
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres
    volumes:
      - .:/app
    networks:
      - carbon_network

  # =========================
  # FLOWER MONITORING
  # =========================
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbon_mrv_flower
    restart: always
    command: >
      celery -A celery_worker flower
      --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - celery_worker
    networks:
      - carbon_network

# =========================
# VOLUMES
# =========================
volumes:
  postgres_data:
  redis_data:
  certificates_data:

# =========================
# NETWORK
# =========================
networks:
  carbon_network:
    driver: bridge